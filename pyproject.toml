[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-reliability-platform"
version = "0.1.0"
description = "A research and engineering platform for systematic LLM reliability evaluation and diagnostics."
readme = "README.md"
requires-python = ">=3.13"
# No runtime dependencies at this stage. Dependencies will be added incrementally
# as specific, justified requirements are identified through research and experimentation.
dependencies = [
    "fastapi>=0.111.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "uvicorn>=0.29.0",
    # Imported unconditionally by providers/openai_provider.py, which the API
    # registry imports, so the server cannot start without it. Also used for
    # OpenAI-compatible local servers (Ollama, vLLM, LM Studio).
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "httpx>=0.27.0",
    "mypy>=1.10",
]
# Required only for SemanticSimilarityEvaluator's real BertScoreBackend
# (llm_reliability.evaluation.semantic_similarity). Not required by the
# standard test suite or any other component: BertScoreBackend imports
# bert-score lazily, and the fake backend used for testing needs no
# dependency at all. Install this extra only to run real BERTScore scoring
# or the opt-in semantic similarity integration test.
# Both ML extras pull in torch. Install the CPU-only build first to avoid the
# multi-GB CUDA wheels, e.g.
#   uv pip install torch --index-url https://download.pytorch.org/whl/cpu
# Verified with torch 2.15.0+cpu, transformers 5.23.0, bert-score 0.3.13 and
# sentence-transformers 6.3.0.
semantic = [
    "bert-score>=0.3.13",
]
# Required only for the real SentenceTransformerEmbeddingModel
# (llm_reliability.rag.embeddings), imported lazily inside embed(); the fake
# embedding model and the OpenAI-compatible one need no extra dependency.
# Install this extra only for local SentenceTransformer retrieval or the
# opt-in embeddings integration test.
embeddings = [
    "sentence-transformers>=6.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_reliability = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/api/conftest.py imports scripts.seed_live_experiments, so the repo root
# must be importable; without this a plain `pytest` fails at collection.
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
# Target Python 3.13.
target-version = "py313"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Renders wide Markdown tables; wrapping the row templates hurts readability.
"scripts/analyze_reliability_study.py" = ["E501"]
"scripts/analyze_robustness_study.py" = ["E501"]
"scripts/run_rejudge_study.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.params.Depends",
    "fastapi.params.Query",
    "fastapi.params.Header",
]

[tool.mypy]
python_version = "3.13"
files = ["src"]
warn_unused_ignores = true

# Optional, lazily imported ML packages: absent in the default install, and
# bert-score ships no type information when present. An override (rather than
# an inline ignore) type-checks the same with or without them installed.
[[tool.mypy.overrides]]
module = ["bert_score", "bert_score.*", "sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true
