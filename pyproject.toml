[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-reliability-platform"
version = "0.1.0"
description = "A research and engineering platform for systematic LLM reliability evaluation and diagnostics."
readme = "README.md"
requires-python = ">=3.13"
# No runtime dependencies at this stage. Dependencies will be added incrementally
# as specific, justified requirements are identified through research and experimentation.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
]
# Required only for SemanticSimilarityEvaluator's real BertScoreBackend
# (llm_reliability.evaluation.semantic_similarity). Not required by the
# standard test suite or any other component: BertScoreBackend imports
# bert-score lazily, and the fake backend used for testing needs no
# dependency at all. Install this extra only to run real BERTScore scoring
# or the opt-in semantic similarity integration test.
semantic = [
    "bert-score>=0.3.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_reliability = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
# Target Python 3.13.
target-version = "py313"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
    "learning/",   # Educational code is exempt from strict linting.
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []
